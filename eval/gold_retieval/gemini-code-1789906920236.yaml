- id: q1
  question: "If the QRC fails during boot, what is the expected system behavior and recommended recovery steps?"
  type: multi_doc
  relevant_sources:
    - boot_sequence.md
    - long_procedures.md
    - changelog_v4.md
  key_points:
    - "If the QRC fails, the boot halts at phase 3 (AI Layer)."
    - "Recovery follows the emergency procedure: activate SafeBoot via the Maintenance Shell, run init_ai_safe.py, inspect the QRC with 'qrc_diag --trace'."
    - "If diagnostics fail: disable AI Layer autoload completely and reboot with a minimal profile."
    - "v4.2 fixed the QRC hang during SafeBoot, but SafeBoot may still fail intermittently on initial attempts: monitor QRC logs."

- id: q2
  question: "Explain the ambiguity around the term 'Safe Mode' and how it might affect operator decisions."
  type: ambiguity
  relevant_sources:
    - ambiguous_safe_mode.md
  key_points:
    - "The term 'Safe Mode' has conflicting meanings: a diagnostic state freezing AI decision-making in firmware v3.x, Isolation Mode cutting external communication in operational manuals, and a low-power state with active network bridges in technician notes."
    - "Operators are required to verify the exact system version and context before executing Safe Mode commands."
    - "This ambiguity has caused past operational incidents where operators unintentionally left the system in an unintended state."

- id: q3
  question: "What contradictions exist in network policies regarding AI outbound communication?"
  type: contradiction
  relevant_sources:
    - network_policies.md
  key_points:
    - "Documentation explicitly contradicts whether Isolation disables outbound traffic: some docs state Isolation disables outbound traffic, while others note internal telemetry uplinks are exempt."
    - "General policy prohibits AI modules from initiating outbound connections without Commander override, while explicitly allowing internal telemetry uplinks."
    - "External bridge behavior in Safe Mode is inconsistent across firmware versions, and firmware v3.x mistakenly allowed redundant outbound packet leaks prior to Patch 7-F."

- id: q4
  question: "Describe the procedure to manually restore communications modules if Isolation Mode was triggered."
  type: factual_specific
  relevant_sources:
    - long_procedures.md
  key_points:
    - "Manually restoring communications modules is Step 7 of the Emergency Startup Procedure, performed after system boot."
    - "Privileges must first be escalated to Commander level to verify override routes (Step 6) prior to restoring communications."
    - "After manually restoring communications modules, the AI Layer is re-enabled only after achieving a successful network sync (Step 8)."

- id: q5
  question: "Who is authorized to override network restrictions, and what conflicts might arise?"
  type: multi_doc
  relevant_sources:
    - network_policies.md
    - staff_bios.md
  key_points:
    - "Emergency network overrides can only be executed by the Station Commander (Cmdr. Zhi Morales) or the AI Ethics Officer (Dr. Laren Doss)."
    - "Cmdr. Zhi Morales favors operational efficiency over strict protocol adherence and occasionally overrides AI routines, which can cause QRC conflicts."
    - "Dr. Laren Doss advocates strict limits on AI autonomy in network operations, conflicting with operational efficiency-driven overrides."