- id: q1
  question: "If the QRC fails during boot, what is the expected system behavior and recommended recovery steps?"
  type: multi_doc
  relevant_sources:
    - boot_sequence.md
    - long_procedures.md
    - changelog_v4.md
  key_points:
    - "If the QRC fails, the boot halts at phase 3, the AI Layer."
    - "Recovery follows the emergency startup procedure: cut power to the Zone 1 and Zone 4 circuit breakers, activate SafeBoot via the Maintenance Shell, run /opt/zshell/scripts/init_ai_safe.py, then inspect the QRC diagnostic output with 'qrc_diag --trace'."
    - "If diagnostics fail, disable AI Layer autoload completely and reboot with a minimal profile. Re-enable the AI Layer only after a successful network sync."
    - "v4.2 fixed the QRC startup hang during SafeBoot, but SafeBoot may still fail intermittently on initial attempts after the patch, so the QRC logs must be monitored for anomalies."
    - "In v4.1, SafeBoot skips the AI Layer, which causes errors in some edge cases with mission-critical AI dependencies. This was fixed in 4.2+."

- id: q2
  question: "Explain the ambiguity around the term 'Safe Mode' and how it might affect operator decisions."
  type: ambiguity
  relevant_sources:
    - ambiguous_safe_mode.md
    - safe_modes.md
  key_points:
    - "In firmware v3.x, 'Safe Mode' is a diagnostic state that freezes AI decision-making while keeping limited sensor input. This differs from Isolation."
    - "In operational manuals and legacy docs, 'Safe Mode' often refers to Isolation Mode, which cuts all external network bridges and communication."
    - "Some technician notes describe 'Safe Mode' as a low-power state with network bridges still active. By contrast, the documented LowPower mode disables communications and sensors."
    - "Operators must confirm the system version and the exact meaning before executing Safe Mode commands. The ambiguity has caused multiple incidents where the system was unintentionally left in an unintended state."

- id: q3
  question: "What contradictions exist in network policies regarding AI outbound communication?"
  type: contradiction
  relevant_sources:
    - network_policies.md
  key_points:
    - "AI modules must not initiate outbound connections without a Commander override, while internal telemetry uplinks are allowed."
    - "Contradiction: some docs say Isolation disables outbound traffic, while others note that telemetry uplinks are exempt."
    - "In 'Safe Mode', external bridges may either remain active or be shut down, depending on the firmware version."
    - "v3.x firmware mistakenly allowed redundant outbound packets, causing leaks. This was fixed by Patch 7-F."
    - "Outbound AI connections require a Commander override, yet emergency overrides that bypass all network restrictions can be performed by either the Commander or the AI Ethics Officer."

- id: q4
  question: "Describe the procedure to manually restore communications modules if Isolation Mode was triggered."
  type: factual_specific
  relevant_sources:
    - long_procedures.md
  key_points:
    - "Manually restoring communications modules when Isolation Mode was triggered is step 7 of the Emergency Startup Procedure."
    - "It comes after a successful boot and after escalating privileges to Commander level to verify override routes (step 6)."
    - "The AI Layer must be re-enabled only after a successful network sync (step 8)."
    - "The corpus gives no detailed sub-steps or commands for the communications restoration itself."

- id: q5
  question: "Who is authorized to override network restrictions, and what conflicts might arise?"
  type: multi_doc
  relevant_sources:
    - network_policies.md
    - staff_bios.md
  key_points:
    - "Emergency overrides can bypass all network restrictions, but only the Commander or the AI Ethics Officer may perform them. AI outbound connections specifically require a Commander override."
    - "The Station Commander is Cmdr. Zhi Morales. The AI Ethics Officer is Dr. Laren Doss."
    - "Cmdr. Morales favors operational efficiency over strict protocol adherence and occasionally overrides AI routines, sometimes causing QRC conflicts."
    - "Dr. Doss advocates strict limits on AI autonomy in network operations. This creates a potential conflict with the Commander's efficiency-driven overrides."