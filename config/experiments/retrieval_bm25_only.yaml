# Override de default.yaml pour l'ablation (eval/run_ablation.py) : variable
# etudiee = le MODE de retrieval (une seule dimension). Necessite 2 cles
# (strategy vaut "dense" dans default.yaml) pour isoler le mode bm25 seul.
# Aucun override de selection.strategy : ni "topk" ni "relative_threshold"
# (le defaut) n'ont besoin d'embeddings, contrairement a l'ancienne strategie
# par densite qui en avait besoin et rendait ce mode de retrieval intestable
# seul (override precedemment necessaire, retire).
retrieval:
  hybrid: false
  strategy: bm25
