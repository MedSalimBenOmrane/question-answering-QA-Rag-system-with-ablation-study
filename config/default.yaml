# Placeholder - configuration par defaut (a completer)

chunking:
  strategy: fixed # fixed | recursive | markdown
  fixed:
    chunk_size_tokens: 200
    overlap_tokens: 20
  recursive:
    chunk_size_tokens: 200
    overlap_tokens: 20
  markdown: {}

embedding:
  provider: bge_m3 # bge_m3 | multilingual_e5
  bge_m3:
    model_name: BAAI/bge-m3
    device: cpu
    batch_size: 32
  multilingual_e5:
    model_name: intfloat/multilingual-e5-base
    device: cpu
    batch_size: 32

vectorstore:
  persist_directory: ./data/chroma
  collection_name: context_aware_qa

retrieval:
  hybrid: true
  strategy: dense # dense | bm25 ; utilise seulement si hybrid=false
  bm25:
    k1: 1.5
    b: 0.75
  rrf_k: 60

reranking:
  enabled: true
  model_name: cross-encoder/ms-marco-MiniLM-L-6-v2
  device: cpu

selection:
  strategy: knapsack_mmr # topk | knapsack | knapsack_mmr
  mmr_lambda: 0.7 # utilise seulement si strategy=knapsack_mmr

token_counter:
  provider: hf # tiktoken | hf ; a aligner sur le tokenizer reel du modele Ollama cible
  tiktoken:
    encoding: cl100k_base
  hf:
    model_name: gpt2
