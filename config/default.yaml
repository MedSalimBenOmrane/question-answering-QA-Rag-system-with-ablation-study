# Placeholder - configuration par defaut (a completer)

# Budget strict de la section 2 du CLAUDE.md : 1024 tokens par question.
budget:
  total: 1024
  reserve_answer: 200 # tokens reserves a la generation de la reponse

pipeline:
  retrieve_k: 10 # nombre de chunks recuperes par le Retriever = taille totale du corpus (10 docs, 1 chunk/doc) : rien n'est perdu a ce stade
  rerank_top_n: 10 # = retrieve_k : le reranking reordonne sans rien ecarter, c'est au Selector (budget-aware) de decider quoi garder.
  # Avant (5) : coupait la moitie du corpus AVANT le Selector, ce qui perdait
  # des chunks pertinents mais lexicalement/semantiquement eloignes de la
  # question sur des questions multi-documents (ex: staff_bios.md pour une
  # question sur les restrictions reseau) independamment du budget restant.

guardrails:
  input:
    max_length: 2000 # caracteres, question utilisateur
  output:
    max_length: 4000 # caracteres, reponse du LLM

chunking:
  strategy: markdown # OPTIMIZED: markdown chunking (respects document structure)
  fixed:
    chunk_size_tokens: 200
    overlap_tokens: 20
  recursive:
    chunk_size_tokens: 200
    overlap_tokens: 20
  markdown: {}

embedding:
  provider: bge_m3 # bge_m3 | multilingual_e5
  bge_m3:
    model_name: BAAI/bge-m3
    device: cpu
    batch_size: 32
  multilingual_e5:
    model_name: intfloat/multilingual-e5-base
    device: cpu
    batch_size: 32

llm:
  model: smollm2:1.7b # OPTIMIZED: best performing model (Faithfulness: 0.943, Correctness: 0.437)
  temperature: 0.1

vectorstore:
  persist_directory: ./data/chroma
  collection_name: context_aware_qa
  chunks_path: ./data/chunks.json # manifeste des chunks indexes (necessaire au retriever BM25/hybride)

retrieval:
  hybrid: true
  strategy: dense # dense | bm25 ; utilise seulement si hybrid=false
  bm25:
    k1: 1.5
    b: 0.75
  rrf_k: 60

# OPTIMIZED: LLM reranker (Bedrock Claude Sonnet 4.6) - best precision (0.950)
# NOTE: min_abs_score auto-adapts to 0.42 when provider=llm (see src/application/answer.py)
reranking:
  enabled: true
  provider: llm
  model_id: global.anthropic.claude-sonnet-4-6
  region: eu-west-3

# Selection with cross-encoder threshold
selection:
  strategy: relative_threshold
  relative_threshold:
    min_abs_score: 0.012
    log_margin: 2.0
    drop_ratio: 0.02
    max_chunks: 5
    min_chunks: 1

token_counter:
  provider: hf
  tiktoken:
    encoding: cl100k_base
  hf:
    model_name: HuggingFaceTB/SmolLM2-1.7B # Aligned with llm.model
